<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1000 300"><desc>Example text04 - Font style</desc><text x="100" y="50" fill="#00f" font-family="Roboto" font-size="55" font-style="normal">Normal text</text><text x="100" y="100" fill="#00f" font-family="Roboto" font-size="55" font-style="italic">Italic text</text><text x="100" y="150" fill="#00f" font-family="Roboto" font-size="55" font-style="oblique">Oblique text</text><text x="100" y="200" fill="#00f" font-family="Roboto" font-size="55" font-style="italic" font-weight="bold">Italic bold text</text></svg>