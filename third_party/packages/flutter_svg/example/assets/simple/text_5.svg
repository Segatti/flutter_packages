<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 500 200"><desc>Example text05 - Text decoration</desc><text x="100" y="60" fill="#00f" font-family="Roboto" font-size="55" font-style="normal" text-decoration="overline" text-decoration-color="red">Overline text</text><text x="100" y="120" fill="#00f" font-family="Roboto" font-size="55" font-style="normal" text-decoration="line-through" text-decoration-color="green">Strike text</text><text x="100" y="180" fill="#00f" font-family="Roboto" font-size="55" font-style="normal" text-decoration="underline" text-decoration-color="green" text-decoration-style="double">Underline text</text></svg>